<div class="machinery-container">

  <div class="search-section card">
    <h2>Search Machinery</h2>
    <form [formGroup]="searchForm" (ngSubmit)="onSearch()">
      <div class="search-controls">
        <div class="form-group">
          <input
            type="text"
            formControlName="search"
            class="form-control"
            placeholder="Search by name or code..."
          >
        </div>
        <div class="form-group">
          <select formControlName="status" class="form-control">
            <option *ngFor="let s of statusOptions" [value]="s.value">{{ s.label }}</option>
          </select>
        </div>
        <div class="form-group">
          <input type="date" formControlName="startDate" class="form-control" placeholder="Start Date">
        </div>
        <div class="form-group">
          <input type="date" formControlName="endDate" class="form-control" placeholder="End Date">
        </div>
        <div class="button-group">
          <button type="submit" class="btn btn-primary">
            <i class="fas fa-search"></i> Search
          </button>
          <button type="button" class="btn btn-secondary" (click)="resetForm()">
            <i class="fas fa-undo"></i> Reset
          </button>
        </div>
      </div>
    </form>
  </div>

  <div class="action-buttons">
    <button routerLink="/machinery/create" class="btn btn-primary">
      <i class="fas fa-plus"></i> Create Machinery
    </button>
  </div>

  <div class="machinery-list card">
    <h2>Machinery</h2>
    <div class="table-responsive">
      <app-loader [show]="isLoading"></app-loader>
      <table class="table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Code</th>
            <th>Remarks</th>
            <th>Status</th>
            <th>Updated At</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let m of machineries">
            <td>{{ m.name }}</td>
            <td>{{ m.code || '-' }}</td>
            <td>{{ m.remarks || '-' }}</td>
            <td><span [ngClass]="'status-' + (m.status || 'a').toLowerCase()">{{ statusLabel(m.status) }}</span></td>
            <td>{{ m.updatedAt ? (m.updatedAt | date:'dd-MM-yyyy HH:mm') : '-' }}</td>
            <td class="actions">
              <button class="btn-icon edit" [routerLink]="['/machinery/edit', encId(m.id)]" title="Edit">
                <i class="fas fa-edit"></i>
              </button>
              <button class="btn-icon delete" (click)="deleteMachinery(m.id ?? 0)" title="Delete">
                <i class="fas fa-trash"></i>
              </button>
            </td>
          </tr>
          <tr *ngIf="!machineries?.length">
            <td colspan="6" class="text-center">No machinery found</td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="table-controls">
      <app-pagination
        *ngIf="totalPages > 0"
        [currentPage]="currentPage"
        [pageSize]="pageSize"
        [totalElements]="totalElements"
        [pageSizeOptions]="pageSizeOptions"
        (pageChange)="onPageChange($event)"
        (pageSizeChange)="onPageSizeChange($event)"
      ></app-pagination>
    </div>
  </div>
</div>
