<div class="searchable-select" [class.active]="isOpen">
  <div class="select-input">
    <input
      type="text"
      class="search-input"
      [placeholder]="placeholder"
      [(ngModel)]="searchText"
      (input)="onSearch($event)"
      (focus)="onFocus()"
      (blur)="onBlur()"
      (keydown)="handleKeydown($event)"
      autocomplete="off"
      role="combobox"
      [attr.aria-expanded]="isOpen"
      aria-autocomplete="list"
      [attr.title]="multiple && !isOpen && searchText ? searchText : null"
    >
    <i class="fas toggle-icon"
       [class.fa-chevron-down]="!isOpen"
       [class.fa-chevron-up]="isOpen"
       (click)="toggleDropdown($event)"
       (mousedown)="$event.preventDefault()"
       role="button"
       tabindex="-1"
       aria-label="Toggle options"></i>
  </div>

  <div class="select-dropdown" *ngIf="isOpen">
    <button type="button" class="scroll-btn scroll-up"
            (mousedown)="$event.preventDefault()"
            (click)="scrollOptions('up', $event)"
            (touchstart)="$event.stopPropagation()"
            tabindex="-1" aria-label="Scroll options up">
      <i class="fas fa-chevron-up"></i>
    </button>
    <div class="options-container" role="listbox">
      <div
        class="option"
        *ngFor="let option of filteredOptions; let i = index"
        (mousedown)="onOptionPointerDown($event, option)"
        [class.selected]="isSelected(option)"
        [class.highlighted]="i === highlightedIndex"
        role="option"
        [attr.aria-selected]="isSelected(option)"
      >
        <div class="option-content">
          <div class="checkbox" *ngIf="multiple">
            <i class="fas fa-check" *ngIf="isSelected(option)"></i>
          </div>
          <span>{{ option[labelKey] }}</span>
        </div>
      </div>
      <div class="no-results" *ngIf="filteredOptions.length === 0">
        No results found
      </div>
    </div>
    <button type="button" class="scroll-btn scroll-down"
            (mousedown)="$event.preventDefault()"
            (click)="scrollOptions('down', $event)"
            (touchstart)="$event.stopPropagation()"
            tabindex="-1" aria-label="Scroll options down">
      <i class="fas fa-chevron-down"></i>
    </button>
  </div>
</div>
