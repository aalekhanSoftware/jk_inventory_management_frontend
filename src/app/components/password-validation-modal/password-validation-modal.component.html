<div *ngIf="display$ | async" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Security Check</h2>
            <button class="close-btn" (click)="close()">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <div class="modal-body">
            <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()">
                <div class="form-group">
                    <label for="password">Enter Password to Continue</label>
                    <div class="password-input-wrapper">
                        <input [type]="showPassword ? 'text' : 'password'" id="password" formControlName="password"
                            class="form-control" placeholder="Enter password"
                            [class.is-invalid]="isSubmitted && passwordForm.get('password')?.errors">
                        <i class="fas" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"
                            (click)="togglePasswordVisibility()"></i>
                    </div>
                    <div class="invalid-feedback"
                        *ngIf="isSubmitted && passwordForm.get('password')?.errors?.['required']">
                        Password is required
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" (click)="close()">Cancel</button>
                    <button type="submit" class="btn btn-primary" [disabled]="loading">
                        <span *ngIf="loading" class="spinner-border spinner-border-sm me-1"></span>
                        Verify
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
